name: ci
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outdoorking
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CI: "1"
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/outdoorking
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/outdoorking
      DATABASE_DRIVER: pg
      AI_MOCK: "1"
      SKIP_ENV_VALIDATION: "1"
      PAYLOAD_SECRET: payload-secret-must-be-at-least-32-chars
      BETTER_AUTH_SECRET: better-auth-secret-must-be-32-chars!
      BETTER_AUTH_URL: http://localhost:3000
      AUTH_RP_ID: localhost
      AUTH_TRUSTED_ORIGINS: http://localhost:3000
      STAFF_EMAIL_DOMAINS: outdoorking.com
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: local-token
      R2_ACCOUNT_ID: local
      R2_ENDPOINT: http://localhost:9000
      R2_ACCESS_KEY_ID: minio
      R2_SECRET_ACCESS_KEY: minio-secret
      R2_BUCKET_MEDIA: ok-media
      R2_BUCKET_PRIVATE: ok-private
      R2_PUBLIC_URL: http://localhost:9000/ok-media
      RESEND_API_KEY: re_test_local
      EMAIL_FROM: OutdoorKing <hello@localhost>
      EMAIL_SALES_TO: sales@example.com
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      PII_KEK_LOCAL: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      PII_HMAC_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_MEDIA_URL: http://localhost:9000/ok-media
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      CSP_REPORT_ONLY: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm check:deps
      - run: SKIP_ENV_VALIDATION=1 pnpm lint
      - run: SKIP_ENV_VALIDATION=1 pnpm typecheck
      - run: pnpm db:migrate && pnpm --filter web payload migrate
      - run: pnpm --filter @ok/db db:check && pnpm --filter web payload migrate:status
      - run: pnpm test
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm build && pnpm test:e2e
  docker:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/outdoorking/web:${{ github.sha }}
      - uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          image: ghcr.io/outdoorking/web:${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes ghcr.io/outdoorking/web:${{ github.sha }}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/outdoorking/web:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
