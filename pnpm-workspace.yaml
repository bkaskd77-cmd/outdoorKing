packages:
  - "apps/*"
  - "packages/*"

catalog:
  zod: 4.6.7
  typescript: 5.9.3
  vitest: 4.1.12
  eslint: 9.39.5

minimumReleaseAge: 4320
# Spec-pinned versions published inside the cooldown window at scaffold time.
minimumReleaseAgeExclude:
  - "better-auth"
  - "@better-auth/*"
  - "ai"
  - "@ai-sdk/*"
  - "typescript-eslint"
  - "@typescript-eslint/*"
  - "motion"
  - "motion-dom"
  - "motion-utils"
  - "framer-motion"
  - "lucide-react"
  - "dependency-cruiser"
  - "better-call"
  - "maplibre-gl"
  - "dompurify"
  - "esbuild"
overrides:
  "dompurify": "3.4.17"
  "maplibre-gl": "6.15.0"
  "esbuild": ">=0.25.0"
  # Security advisories in transitive deps (security / audit + osv).
  "undici@<7.30.1": "^7.30.1"
  "fast-uri@<3.1.9": "^3.1.9"
  "happy-dom@<21.0.4": "^21.0.4"
  "graphql-scalars@<2.0.1": "^2.0.1"
  "glob@>=13 <14.0.2": "^14.0.3"

audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm

onlyBuiltDependencies:
  - sharp
  - esbuild
  - "@swc/core"
  - unrs-resolver
  - lefthook
  - "@parcel/watcher"
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  lefthook: true
  unrs-resolver: true
  sharp: true
  msgpackr-extract: false
