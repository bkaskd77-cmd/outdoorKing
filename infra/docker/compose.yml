services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: outdoorking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d outdoorking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redis-http:
    image: hiett/serverless-redis-http:latest
    depends_on:
      - redis
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-token
      SRH_CONNECTION_STRING: redis://redis:6379

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minio minio-secret;
      mc mb --ignore-existing local/ok-media;
      mc mb --ignore-existing local/ok-private;
      mc anonymous set download local/ok-media;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  intel:
    build:
      context: ../../apps/intel
    ports:
      - "8100:8100"
    environment:
      INTEL_HMAC_SECRET: intel-hmac-secret-must-be-32-chars!!

volumes:
  postgres-data:
  minio-data:
