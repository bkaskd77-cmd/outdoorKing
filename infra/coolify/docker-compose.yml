# Coolify / single-host production stack. Postgres, Redis and MinIO already
# exist for local dev in ../docker/compose.yml — this file is the cutover shape.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: postgres
      POSTGRES_DB: outdoorking
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d outdoorking"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-secret}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minio} $${MINIO_ROOT_PASSWORD:-minio-secret};
      mc mb --ignore-existing local/ok-media;
      mc mb --ignore-existing local/ok-private;
      mc anonymous set download local/ok-media;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-secret}

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../../.env.docker
    environment:
      QUEUE_DRIVER: bullmq
      REDIS_URL: redis://redis:6379
      DATABASE_DRIVER: pg
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/outdoorking
      DATABASE_URL_UNPOOLED: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/outdoorking
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../../.env.docker
    environment:
      QUEUE_DRIVER: bullmq
      REDIS_URL: redis://redis:6379
      DATABASE_DRIVER: pg
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/outdoorking
      DATABASE_URL_UNPOOLED: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/outdoorking
    restart: unless-stopped

  intel:
    build:
      context: ../../apps/intel
    environment:
      INTEL_HMAC_SECRET: ${INTEL_HMAC_SECRET:-intel-hmac-secret-must-be-32-chars!!}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
