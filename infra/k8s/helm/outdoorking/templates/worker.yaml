apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "outdoorking.name" . }}-worker
  labels:
    {{- include "outdoorking.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: worker
          image: {{ .Values.image.worker }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "outdoorking.name" . }}-env
          env:
            - name: QUEUE_DRIVER
              value: {{ .Values.env.QUEUE_DRIVER | quote }}
            - name: REDIS_URL
              value: {{ .Values.env.REDIS_URL | quote }}
            - name: DATABASE_DRIVER
              value: {{ .Values.env.DATABASE_DRIVER | quote }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
